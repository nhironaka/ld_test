name: PostHogDemo
options:
  bundleIdPrefix: com.launchdarkly
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"

targets:
  PostHogDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        UILaunchStoryboardName: ""
        CFBundleName: PostHogDemo
        CFBundleIdentifier: com.launchdarkly.PostHogDemo
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
    dependencies:
      - package: PostHog
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.launchdarkly.PostHogDemo
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""

schemes:
  PostHogDemo:
    build:
      targets:
        PostHogDemo: all
    run:
      config: Debug
